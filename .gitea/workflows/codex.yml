# Codex runner tetikleyicisi. Her depoya `.gitea/workflows/codex.yml` olarak kopyalanır.
# Üç tetikleyici:
#   - issues (opened/edited/labeled) : `codex` etiketli issue açılınca/düzenlenince/etiketlenince işlenir
#                      (betik etiketi kendisi doğrular; bu Gitea sürümünde `labeled` olayı güvenilir tetiklenmiyor)
#   - schedule       : 10 dakikada bir kuyruktaki en eski uygun issue işlenir (limit dolunca yeniden deneme)
#   - workflow_dispatch : elle, issue numarası verilerek
# actions/checkout kullanılmaz; betik kendi klonunu /opt/codex-runner/work altına yapar.
name: codex

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'İşlenecek issue numarası'
        required: true
        type: string

jobs:
  codex:
    runs-on: host
    env:
      EVENT_NAME: ${{ gitea.event_name }}
      EVENT_ACTION: ${{ gitea.event.action }}
      EVENT_ACTOR: ${{ gitea.actor }}
      REPO: ${{ gitea.repository }}
      LABEL_NAME: ${{ gitea.event.label.name }}
      ISSUE_NUMBER: ${{ gitea.event.issue.number }}
      DISPATCH_ISSUE: ${{ gitea.event.inputs.issue }}
    steps:
      - name: Codex görevini çalıştır
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            issues)
              # run-task.sh issue'nun açık ve `codex` etiketli olduğunu, in-progress/pr/failed olmadığını kendisi doğrular.
              exec /opt/codex-runner/bin/run-task.sh "$REPO" "$ISSUE_NUMBER" ;;
            workflow_dispatch)
              exec /opt/codex-runner/bin/run-task.sh "$REPO" "$DISPATCH_ISSUE" ;;
            schedule)
              exec /opt/codex-runner/bin/pick-task.sh "$REPO" ;;
            *)
              echo "beklenmeyen olay: $EVENT_NAME"; exit 0 ;;
          esac
