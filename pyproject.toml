[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-health-mirror"
version = "0.2.0"
description = "Self-hosted, raw-first Google Health API archive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-json-logger>=3.2,<5",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pyright[nodejs]>=1.1.414,<1.2",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
health-mirror = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs DATABASE_URL pointing at PostgreSQL; skipped otherwise (tests/integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.uv]
required-version = ">=0.12.1,<0.13"
